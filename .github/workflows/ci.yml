name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (node ${{ matrix.node }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # x86_64 Linux
          - ubuntu-24.04-arm   # aarch64 Linux
          - macos-latest       # Apple Silicon
          - macos-15-intel     # x86_64 macOS
          - windows-latest     # x86_64 Windows
          - windows-11-arm     # aarch64 Windows
        node: [24]
        python: ["3.12"]
        include:
          # The oldest supported runtimes: Node 22.6+ and Python 3.9.
          - os: ubuntu-latest
            node: 22
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Format
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.node == 24
        run: zig fmt --check src tests bench build.zig
      - name: Unit tests
        run: zig build test --summary all
      - name: End-to-end tests
        run: zig build e2e

  packages:
    name: release build and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release build (all targets)
        run: zig build release
      - name: Binary sizes
        run: ls -l zig-out/release/*/
      - name: Build the npm package and wheels
        run: python packaging/build.py --version 0.0.0 --out dist-packages
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist-packages/zig_anything-0.0.0-*manylinux*x86_64*.whl
          /tmp/venv/bin/zig-anything --version
          /tmp/venv/bin/python -m zig_anything help plan
      - name: Smoke-test the npm package
        run: |
          (cd dist-packages/npm && npm pack --pack-destination ..)
          mkdir /tmp/npm-smoke && cd /tmp/npm-smoke && npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/dist-packages/zig-anything-0.0.0.tgz
          npx --no-install zig-anything --version
          set +e; npx --no-install zig-anything diff no-such-unit; code=$?; set -e
          test "$code" = 3   # exit codes pass through the launcher
      - name: End-to-end benchmark (smoke)
        run: python bench/e2e.py --runs 1 --out /tmp/bench.json
